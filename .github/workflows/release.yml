name: Build and release StructLens setup installers

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHON_VERSION: "3.11"

jobs:
  build-windows:
    name: Build Windows setup
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Build wheel and standalone CLI
        shell: bash
        run: |
          python -m pip install --upgrade pip build pyinstaller "freesasa>=2.2.1"
          python scripts/fetch_backends.py --platform Windows
          choco install mingw --no-progress --yes
          git clone --depth 1 https://github.com/pylelab/USalign.git build/usalign-src
          git -C build/usalign-src fetch --depth 1 origin fa4376bd99fa17a123d05d7ea47cf6574c80d64f
          git -C build/usalign-src checkout fa4376bd99fa17a123d05d7ea47cf6574c80d64f
          mkdir -p src/structlens/resources/usalign/windows-x64
          g++ -O3 -static -o src/structlens/resources/usalign/windows-x64/USalign.exe build/usalign-src/USalign.cpp
          cp build/usalign-src/LICENSE src/structlens/resources/usalign/LICENSE
          printf 'pylelab/USalign pinned source\n' > src/structlens/resources/usalign/VERSION
          python scripts/verify_release_backends.py --platform windows
          python -m build --wheel
          python -m pip install .
          python scripts/build_icon.py
          python -m PyInstaller \
            --onefile \
            --clean \
            --noconfirm \
            --name structlens \
            --paths src \
            --collect-all structlens \
            --collect-data Bio \
            --collect-all freesasa \
            src/structlens/cli/main.py
          python -m pip install ".[gui]"
          python -m PyInstaller \
            --clean \
            --noconfirm \
            --name StructLens \
            --noconsole \
            --icon packaging/windows/structlens.ico \
            --paths src \
            --collect-all structlens \
            --collect-data Bio \
            --collect-all freesasa \
            --exclude-module PySide6 \
            --hidden-import PyQt5.QtCore \
            --hidden-import PyQt5.QtGui \
            --hidden-import PyQt5.QtWidgets \
            src/structlens/gui/main.py
          ./dist/structlens.exe --help

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress --yes

      - name: Compile Windows setup
        shell: pwsh
        run: |
          $version = python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])"
          if ("${{ github.ref_name }}" -match '^v') { $version = "${{ github.ref_name }}" -replace '^v', '' }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$version" packaging/windows/structlens.iss
          Get-FileHash "release/StructLens-v$version-Windows-x86_64-Setup.exe" -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $($_.Path | Split-Path -Leaf)" } | Set-Content "release/StructLens-v$version-Windows-x86_64-Setup.exe.sha256"

      - name: Upload Windows setup artifact
        uses: actions/upload-artifact@v4
        with:
          name: StructLens-windows-setup
          path: |
            release/StructLens-v*-Windows-x86_64-Setup.exe*
            dist/structlens-*.whl

  build-linux:
    name: Build Linux setup
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Build wheel and standalone CLI
        shell: bash
        run: |
          python -m pip install --upgrade pip build pyinstaller "freesasa>=2.2.1"
          python scripts/fetch_backends.py --platform Linux
          sudo apt-get update
          sudo apt-get install -y g++ dpkg fuse3
          git clone --depth 1 https://github.com/pylelab/USalign.git build/usalign-src
          git -C build/usalign-src fetch --depth 1 origin fa4376bd99fa17a123d05d7ea47cf6574c80d64f
          git -C build/usalign-src checkout fa4376bd99fa17a123d05d7ea47cf6574c80d64f
          mkdir -p src/structlens/resources/usalign/linux-x64
          g++ -O3 -static -o src/structlens/resources/usalign/linux-x64/USalign build/usalign-src/USalign.cpp
          cp build/usalign-src/LICENSE src/structlens/resources/usalign/LICENSE
          printf 'pylelab/USalign pinned source\n' > src/structlens/resources/usalign/VERSION
          python scripts/verify_release_backends.py --platform linux
          python -m build --wheel
          python -m pip install .
          python scripts/build_icon.py
          python -m PyInstaller \
            --onefile \
            --clean \
            --noconfirm \
            --name structlens \
            --paths src \
            --collect-all structlens \
            --collect-data Bio \
            --collect-all freesasa \
            src/structlens/cli/main.py
          python -m pip install ".[gui]"
          python -m PyInstaller \
            --clean \
            --noconfirm \
            --name StructLens \
            --noconsole \
            --icon packaging/windows/structlens.ico \
            --paths src \
            --collect-all structlens \
            --collect-data Bio \
            --collect-all freesasa \
            --exclude-module PySide6 \
            --hidden-import PyQt5.QtCore \
            --hidden-import PyQt5.QtGui \
            --hidden-import PyQt5.QtWidgets \
            src/structlens/gui/main.py
          ./dist/structlens --help

      - name: Assemble Debian and AppImage setup packages
        shell: bash
        run: |
          version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [[ "$GITHUB_REF_NAME" == v* ]]; then version="${GITHUB_REF_NAME#v}"; fi
          bash packaging/linux/build_packages.sh "$version" "$PWD/dist"

      - name: Upload Linux setup artifact
        uses: actions/upload-artifact@v4
        with:
          name: StructLens-linux-setup
          path: |
            release/structlens_*.deb*
            release/StructLens-v*-Linux-x86_64.AppImage*

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - build-windows
      - build-linux
    runs-on: ubuntu-latest
    steps:
      - name: Download setup artifacts
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Create release and upload setup files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release-assets
          find release -type f \( -name 'StructLens-v*-Windows-x86_64-Setup.exe' -o -name 'StructLens-v*-Windows-x86_64-Setup.exe.sha256' -o -name 'structlens_*.deb' -o -name 'structlens_*.deb.sha256' -o -name 'StructLens-v*-Linux-x86_64.AppImage' -o -name 'StructLens-v*-Linux-x86_64.AppImage.sha256' \) -exec cp {} release-assets/ \;
          gh release create "${GITHUB_REF_NAME}" release-assets/* --repo "${GITHUB_REPOSITORY}" --title "StructLens ${GITHUB_REF_NAME}" --generate-notes
