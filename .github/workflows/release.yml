name: Build and release setup installers

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHON_VERSION: "3.11"

jobs:
  build-windows:
    name: Build Windows setup
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Build wheel and standalone CLI
        shell: bash
        run: |
          python -m pip install --upgrade pip build pyinstaller
          python -m build --wheel
          python -m pip install .
          python -m PyInstaller \
            --onefile \
            --clean \
            --noconfirm \
            --name StructLens \
            --paths src \
            --collect-all structlens \
            --collect-data Bio \
            src/structlens/cli/main.py
          ./dist/StructLens.exe --help

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress --yes

      - name: Compile Windows setup
        shell: pwsh
        run: |
          $version = python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])"
          if ("${{ github.ref_name }}" -match '^v') { $version = "${{ github.ref_name }}" -replace '^v', '' }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$version" packaging/windows/structlens.iss

      - name: Upload Windows setup artifact
        uses: actions/upload-artifact@v4
        with:
          name: StructLens-windows-setup
          path: |
            release/StructLens-Setup.exe
            dist/structlens-*.whl

  build-linux:
    name: Build Linux setup
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Build wheel and standalone CLI
        shell: bash
        run: |
          python -m pip install --upgrade pip build pyinstaller
          python -m build --wheel
          python -m pip install .
          python -m PyInstaller \
            --onefile \
            --clean \
            --noconfirm \
            --name StructLens \
            --paths src \
            --collect-all structlens \
            --collect-data Bio \
            src/structlens/cli/main.py
          ./dist/StructLens --help

      - name: Assemble Debian setup package
        shell: bash
        run: |
          version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [[ "$GITHUB_REF_NAME" == v* ]]; then version="${GITHUB_REF_NAME#v}"; fi
          package_root="build/deb"
          mkdir -p "$package_root/DEBIAN" "$package_root/usr/bin" \
            "$package_root/usr/share/structlens" "$package_root/usr/share/applications"
          cp dist/StructLens "$package_root/usr/bin/structlens"
          cp dist/structlens-*.whl packaging/linux/install-structlens.sh README.md LICENSE \
            "$package_root/usr/share/structlens/"
          chmod 0755 "$package_root/usr/bin/structlens" "$package_root/usr/share/structlens/install-structlens.sh"
          cat > "$package_root/DEBIAN/control" <<EOF
          Package: structlens
          Version: ${version}
          Section: science
          Priority: optional
          Architecture: amd64
          Maintainer: Adriano Marques Gonçalves (UNIARA)
          Depends: libc6
          Description: Reproducible protein-structure comparison and PyMOL plugin
           StructLens provides sequence/structure comparison, mutation evidence, and exports.
          EOF
          cat > "$package_root/usr/share/applications/structlens.desktop" <<EOF
          [Desktop Entry]
          Type=Application
          Name=StructLens
          Comment=Protein structure comparison
          Exec=/usr/bin/structlens --help
          Terminal=true
          Categories=Science;Education;
          EOF
          mkdir -p release
          dpkg-deb --build --root-owner-group "$package_root" "release/StructLens-Setup.deb"

      - name: Upload Linux setup artifact
        uses: actions/upload-artifact@v4
        with:
          name: StructLens-linux-setup
          path: |
            release/StructLens-Setup.deb

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - build-windows
      - build-linux
    runs-on: ubuntu-latest
    steps:
      - name: Download setup artifacts
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Create release and upload setup files
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" release/* --repo "${GITHUB_REPOSITORY}" --title "StructLens ${GITHUB_REF_NAME}" --generate-notes
