name: Build and release StructLens setup installers

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"

jobs:
  quality:
    name: Test release candidate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install Qt system libraries
        run: bash scripts/install_ci_linux_packages.sh libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3
      - name: Install release test dependencies
        run: python -m pip install -e ".[dev,gui,gui-pyqt5,charts]"
      - name: Check release version and static analysis
        run: |
          version=$(python -c 'from structlens import __version__;print(__version__)')
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            [[ "$GITHUB_REF_NAME" == "v$version" && -s "RELEASE_NOTES_v$version.md" ]]
          fi
          python -m ruff check src tests scripts
          python -m mypy
      - name: Run tests with coverage
        timeout-minutes: 15
        run: python -m pytest -q -rs -o faulthandler_timeout=65 --cov=src/structlens --cov-fail-under=80

  build-windows:
    name: Build Windows setup
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Build wheel and standalone CLI
        shell: bash
        run: |
          python -m pip install --upgrade pip build pyinstaller "freesasa>=2.2.1"
          python scripts/fetch_backends.py --platform Windows
          choco install mingw --no-progress --yes
          git clone --depth 1 https://github.com/pylelab/USalign.git build/usalign-src
          git -C build/usalign-src fetch --depth 1 origin fa4376bd99fa17a123d05d7ea47cf6574c80d64f
          git -C build/usalign-src checkout fa4376bd99fa17a123d05d7ea47cf6574c80d64f
          mkdir -p src/structlens/resources/usalign/windows-x64
          g++ -O3 -static -o src/structlens/resources/usalign/windows-x64/USalign.exe build/usalign-src/USalign.cpp
          cp build/usalign-src/LICENSE src/structlens/resources/usalign/LICENSE
          printf 'pylelab/USalign pinned source\n' > src/structlens/resources/usalign/VERSION
          python scripts/verify_release_backends.py --platform windows
          python -m build --wheel
          python -m pip install .
          python scripts/build_icon.py
          python -m PyInstaller \
            --onefile \
            --clean \
            --noconfirm \
            --name structlens \
            --paths src \
            --collect-all structlens \
            --collect-data Bio \
            --collect-all freesasa \
            src/structlens/cli/main.py
          python -m pip install ".[gui,charts]"
          python -m PyInstaller \
            --clean \
            --noconfirm \
            --name StructLens \
            --noconsole \
            --icon packaging/windows/structlens.ico \
            --paths src \
            --collect-all structlens \
            --collect-data Bio \
            --collect-all freesasa \
            --exclude-module PyQt5 \
            --hidden-import matplotlib.backends.backend_qtagg \
            --copy-metadata matplotlib \
            --hidden-import PySide6.QtCore \
            --hidden-import PySide6.QtGui \
            --hidden-import PySide6.QtWidgets \
            src/structlens/gui/main.py
          ./dist/structlens.exe --help

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress --yes

      - name: Compile Windows setup
        shell: pwsh
        run: |
          $version = python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])"
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$version" packaging/windows/structlens.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-FileHash "release/StructLens-v$version-Windows-x86_64-Setup.exe" -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $($_.Path | Split-Path -Leaf)`n" } | Set-Content "release/StructLens-v$version-Windows-x86_64-Setup.exe.sha256" -Encoding ascii -NoNewline

      - name: Smoke installed Windows package
        shell: pwsh
        run: |
          $installer = (Get-Item release/StructLens-v*-Windows-x86_64-Setup.exe).FullName
          $destination = Join-Path $env:RUNNER_TEMP 'structlens-installed'
          $setup = Start-Process -FilePath $installer -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',("/DIR=`"$destination`"")) -WindowStyle Hidden -PassThru -Wait
          if ($setup.ExitCode -ne 0) { throw "Inno Setup failed: $($setup.ExitCode)" }
          python scripts/smoke_release_package.py "$destination/structlens.exe" "$destination/gui/StructLens.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload Windows setup artifact
        uses: actions/upload-artifact@v4
        with:
          name: StructLens-windows-setup
          if-no-files-found: error
          path: release/StructLens-v*-Windows-x86_64-Setup.exe*

  build-linux:
    name: Build Linux setup
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Build wheel and standalone CLI
        shell: bash
        run: |
          python -m pip install --upgrade pip build pyinstaller "freesasa>=2.2.1"
          python scripts/fetch_backends.py --platform Linux
          bash scripts/install_ci_linux_packages.sh g++ dpkg fuse3 libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3
          git clone --depth 1 https://github.com/pylelab/USalign.git build/usalign-src
          git -C build/usalign-src fetch --depth 1 origin fa4376bd99fa17a123d05d7ea47cf6574c80d64f
          git -C build/usalign-src checkout fa4376bd99fa17a123d05d7ea47cf6574c80d64f
          mkdir -p src/structlens/resources/usalign/linux-x64
          g++ -O3 -static -o src/structlens/resources/usalign/linux-x64/USalign build/usalign-src/USalign.cpp
          cp build/usalign-src/LICENSE src/structlens/resources/usalign/LICENSE
          printf 'pylelab/USalign pinned source\n' > src/structlens/resources/usalign/VERSION
          python scripts/verify_release_backends.py --platform linux
          python -m build --wheel
          python -m pip install .
          python scripts/build_icon.py
          python -m PyInstaller \
            --onefile \
            --clean \
            --noconfirm \
            --name structlens \
            --paths src \
            --collect-all structlens \
            --collect-data Bio \
            --collect-all freesasa \
            src/structlens/cli/main.py
          python -m pip install ".[gui,charts]"
          python -m PyInstaller \
            --clean \
            --noconfirm \
            --name StructLens \
            --noconsole \
            --icon packaging/windows/structlens.ico \
            --paths src \
            --collect-all structlens \
            --collect-data Bio \
            --collect-all freesasa \
            --exclude-module PyQt5 \
            --hidden-import matplotlib.backends.backend_qtagg \
            --copy-metadata matplotlib \
            --hidden-import PySide6.QtCore \
            --hidden-import PySide6.QtGui \
            --hidden-import PySide6.QtWidgets \
            src/structlens/gui/main.py
          ./dist/structlens --help

      - name: Assemble Debian and AppImage setup packages
        shell: bash
        run: |
          version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          bash packaging/linux/build_packages.sh "$version" "$PWD/dist"

      - name: Smoke Debian and AppImage packages
        run: |
          dpkg-deb -x release/structlens_*_amd64.deb "$RUNNER_TEMP/deb"
          python scripts/smoke_release_package.py "$RUNNER_TEMP/deb/opt/structlens/structlens" "$RUNNER_TEMP/deb/opt/structlens/StructLens"
          image=$(realpath release/StructLens-v*-Linux-x86_64.AppImage)
          (cd "$RUNNER_TEMP" && "$image" --appimage-extract >/dev/null)
          python scripts/smoke_release_package.py "$RUNNER_TEMP/squashfs-root/opt/structlens/structlens" "$RUNNER_TEMP/squashfs-root/AppRun"

      - name: Upload Linux setup artifact
        uses: actions/upload-artifact@v4
        with:
          name: StructLens-linux-setup
          if-no-files-found: error
          path: |
            release/structlens_*.deb*
            release/StructLens-v*-Linux-x86_64.AppImage*

  release:
    permissions:
      contents: write
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - quality
      - build-windows
      - build-linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download setup artifacts
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Create release and upload setup files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          names=("StructLens-v${version}-Windows-x86_64-Setup.exe" "structlens_${version}_amd64.deb" "StructLens-v${version}-Linux-x86_64.AppImage")
          notes="$GITHUB_WORKSPACE/RELEASE_NOTES_${GITHUB_REF_NAME}.md"
          test -s "$notes"
          cd release
          [[ "$(find . -type f | wc -l)" -eq 6 ]]
          for name in "${names[@]}"; do
            test -s "$name" && test -s "$name.sha256"
            [[ "$(tr -d '\r' < "$name.sha256")" == "$(sha256sum "$name")" ]]
            sha256sum --check --strict "$name.sha256"
          done
          if gh release view "$GITHUB_REF_NAME" --json isDraft --jq '.isDraft' > "$RUNNER_TEMP/structlens-existing-release"; then
            [[ "$(cat "$RUNNER_TEMP/structlens-existing-release")" == true ]]
            gh release upload "$GITHUB_REF_NAME" ./* --clobber
          else
            gh release create "$GITHUB_REF_NAME" ./* --draft --verify-tag --title "StructLens $GITHUB_REF_NAME" --notes-file "$notes"
          fi
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest --notes-file "$notes"
