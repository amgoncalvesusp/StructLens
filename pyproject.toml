[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "structlens"
version = "0.1.0"
description = "Reproducible protein-structure comparison and visualization core"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "biopython>=1.81",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.8",
    "types-openpyxl>=3.1",
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "ruff>=0.6",
]

[project.scripts]
structlens = "structlens.cli.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
structlens = ["plugin/assets/*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--strict-config"

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["structlens"]
mypy_path = ["src"]
