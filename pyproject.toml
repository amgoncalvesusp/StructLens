[build-system]
requires = ["setuptools>=83"]
build-backend = "setuptools.build_meta"

[project]
name = "structlens"
version = "0.3.0"
description = "Integrated protein sequence and structure comparison with reproducible PyMOL handoff"
authors = [
    { name = "Adriano Marques Gonçalves (UNIARA)" },
]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "biopython>=1.81",
    "openpyxl>=3.1",
    "Pillow>=12.3.0",
    "freesasa>=2.2.1",
]

[project.optional-dependencies]
gui = [
    "PyQt5>=5.15.10,<5.16",
]
gui-pyside6 = [
    "PySide6>=6.7",
]
charts = [
    "matplotlib>=3.8,<4",
]
dev = [
    "mypy>=1.8",
    "types-openpyxl>=3.1",
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "ruff>=0.6",
]

[project.scripts]
structlens = "structlens.cli.main:main"
structlens-gui = "structlens.gui.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
structlens = [
    "plugin/assets/*.png",
    "resources/usalign/VERSION",
    "resources/usalign/LICENSE",
    "resources/usalign/CITATION.md",
    "resources/usalign/*/USalign",
    "resources/usalign/*/USalign.exe",
    "resources/muscle/VERSION",
    "resources/muscle/LICENSE",
    "resources/muscle/CITATION.md",
    "resources/muscle/*/muscle",
    "resources/muscle/*/muscle.exe",
    "resources/muscle/*/*.sha256",
    "resources/freesasa/VERSION",
    "resources/freesasa/LICENSE",
    "resources/freesasa/CITATION.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--strict-config"

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "UP042"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["structlens"]
mypy_path = ["src"]
